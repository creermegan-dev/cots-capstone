name: cots_monitor
description: COTS Monitor capstone dashboard
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  exif: ^3.3.0
  geolocator: ^13.0.2
  intl: ^0.19.0
  flutter_map: 6.1.0
  latlong2: 0.9.1
  firebase_core: ^4.7.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.4.0
  firebase_storage: ^13.4.0
  provider: ^6.1.2
  http: ^1.2.2
  fl_chart: ^0.69.2
  google_fonts: ^6.2.1
  flutter_onnxruntime: ^1.7.1
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/cots_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/cots_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/cots_logo.png
    - assets/models/yolov8_best.onnx
    - assets/models/yolo26_best.onnx

project_id = "cots-monitor-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["cots-monitor://auth-callback/"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.verify-evidence]
# Authentication is enforced inside the function so it can accept either an
# owner JWT or the hosted Cron secret key without exposing privileged output.
verify_jwt = false
static_files = [ "./functions/verify-evidence/magick.wasm" ]
